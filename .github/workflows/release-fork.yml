name: Release (fork)

# 只在打 fork-v* 标签时触发，避免与上游 CI 的 main/PR 流程相互干扰。
# 产物命名与官方 chenhg5/cc-connect 保持一致：
#   cc-connect-<version>-<goos>-<goarch>.tar.gz  （非 Windows）
#   cc-connect-<version>-<goos>-<goarch>.zip     （Windows）
#   checksums.txt
on:
  push:
    tags:
      - 'fork-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签名（如 fork-v1）'
        required: true
        type: string

permissions:
  contents: read

env:
  APP: cc-connect
  CMD: ./cmd/cc-connect
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  HOME: ${{ github.workspace }}/.cache/home
  TMPDIR: ${{ github.workspace }}/.cache/tmp
  TEMP: ${{ github.workspace }}/.cache/tmp
  TMP: ${{ github.workspace }}/.cache/tmp
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  GOPATH: ${{ github.workspace }}/.cache/go-path
  GOBIN: ${{ github.workspace }}/.cache/go-path/bin
  GOTMPDIR: ${{ github.workspace }}/.cache/tmp
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg-cache
  XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
  XDG_DATA_HOME: ${{ github.workspace }}/.cache/xdg-data
  PNPM_HOME: ${{ github.workspace }}/.cache/pnpm-home
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
  GH_CONFIG_DIR: ${{ github.workspace }}/.cache/gh-config
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.cache/toolchains
  RUNNER_TEMP: ${{ github.workspace }}/.cache/tmp
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOENV: 'off'
  GOTELEMETRY: 'off'
  GOFLAGS: -mod=readonly
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_NOSYSTEM: '1'
  GH_NO_UPDATE_NOTIFIER: '1'
  GH_NO_EXTENSION_UPDATE_NOTIFIER: '1'
  GH_PROMPT_DISABLED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          set-safe-directory: false

      - name: Verify release output boundaries
        run: |
          if GOBIN="$GITHUB_WORKSPACE-other/tools" bash .github/release-env.sh; then
            echo "Preflight accepted an external GOBIN." >&2
            exit 1
          fi
          bash .github/release-env.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          dest: ${{ github.workspace }}/.cache/pnpm-setup

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
          pnpm build

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Validate release workflow and formatting
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          "$GOPATH/bin/actionlint"
          test -z "$(gofmt -l core/dir_list.go core/dir_list_test.go core/cuj_test.go core/engine.go core/i18n.go core/notify.go core/updater_fork_test.go platform/feishu/card.go platform/feishu/card_test.go platform/feishu/dir_list_test.go platform/feishu/feishu.go)"

      - name: Build and vet all packages
        run: |
          go build -tags goolm ./...
          go vet -tags goolm ./...

      - name: Run full repository race tests
        run: go test -race -tags goolm -count=1 -timeout 10m ./...

      - name: Run critical user journeys and permission regression
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -race -tags goolm -count=1 ./core -run TestCUJ
          go test -race -tags goolm -count=1 -v ./core -run '^TestDirListCardAction_UnreadableChildPreservesSessionAndRetry$' | tee .cache/permission.log
          grep -q '^--- PASS: TestDirListCardAction_UnreadableChildPreservesSessionAndRetry' .cache/permission.log

      - name: Upload verified web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          set-safe-directory: false

      - name: Verify release output boundaries
        run: bash .github/release-env.sh

      - name: 解析版本与提交
        id: meta
        run: |
          set -euo pipefail
          REF="$RELEASE_TAG"
          git check-ref-format "refs/tags/$REF"
          test "$REF" = "$(git describe --tags --exact-match HEAD)"
          echo "version=${REF#fork-}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download verified web assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          OUT="$APP-${VERSION}-${GOOS}-${GOARCH}${EXT}"
          mkdir -p dist
          go build -trimpath -tags 'goolm' \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X github.com/chenhg5/cc-connect/core.UpdateRepository=${GITHUB_REPOSITORY}" \
            -o "dist/${OUT}" "$CMD"
          echo "已构建 dist/${OUT}"

      - name: 打包
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for f in "$APP"-*; do
            case "$f" in
              *.tar.gz|*.zip) continue ;;
              *.exe) zip -q "${f%.exe}.zip" "$f" && rm -f "$f" ;;
              *) tar czf "$f.tar.gz" "$f" && rm -f "$f" ;;
            esac
          done
          sha256sum -- * > checksums.txt
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          set-safe-directory: false

      - name: Verify release output boundaries
        run: bash .github/release-env.sh

      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cc-connect-*
          merge-multiple: true

      - name: 生成合并校验和
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          test "${#archives[@]}" -eq 6
          # 各矩阵任务各自生成了 checksums.txt，这里按最终文件重算一份
          rm -f checksums.txt
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create complete draft and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          test "$TAG" = "$(git describe --tags --exact-match HEAD)"
          NOTES="docs/releases/${TAG#fork-}.md"
          test -f "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its assets." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --verify-tag --prerelease --draft
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 7
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
