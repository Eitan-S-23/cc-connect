name: Windows restart and upgrade regression
on:
  push:
    branches: ['codex/windows-restart-upgrade']
permissions:
  contents: read
env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  GOFLAGS: -mod=readonly
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CC_WINDOWS_TASK_TESTS: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Validate paths and prepare local tools
        run: .github/windows-restart-env.ps1
      - name: Prove the old updater fails with a mapped backup
        run: |
          git worktree add --detach .cache/baseline e2b9795d19ea26778dd8403d711f20748675d8ef
          Copy-Item core/updater_locked_windows_test.go .cache/baseline/core/updater_locked_windows_test.go
          Push-Location .cache/baseline
          go test -tags 'goolm,no_web' -count=1 -v ./core -run '^TestWindowsUpgradeWithMappedLegacyBackup$' 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/.cache/evidence/baseline.log"
          $code=$LASTEXITCODE
          Pop-Location
          if ($code -eq 0) { throw 'Pre-fix regression unexpectedly passed' }
          if (-not (Select-String -Path .cache/evidence/baseline.log -SimpleMatch 'REGRESSION: mapped historical backup prevents the next upgrade')) { throw 'Baseline failed for an unrelated reason' }
          Write-Host '::notice::Pre-fix mapped executable regression failed as expected.'
          Copy-Item .github/fixtures/legacy-supervisor_windows_test.go .cache/baseline/daemon/legacy-supervisor_windows_test.go
          Push-Location .cache/baseline
          go test -c -tags 'goolm,no_web' -o "$env:GITHUB_WORKSPACE/.cache/bin/legacy-supervisor.exe" ./daemon
          if ($LASTEXITCODE -ne 0) { throw 'Legacy supervisor fixture did not compile' }
          Pop-Location
          "CC_LEGACY_SUPERVISOR_FIXTURE=$env:GITHUB_WORKSPACE/.cache/bin/legacy-supervisor.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          exit 0
      - name: Windows process, backup and restart regressions
        run: .github/windows-ci-command.ps1 focused go test -tags 'goolm,no_web' -count=1 -v -timeout 12m ./core ./daemon ./cmd/cc-connect -run 'Test(Windows|UpdateTransaction|RestartNotify|CUJ_U1|RunCommandInKillJob|AcquireSupervisor|WaitForSupervisor|AdoptExisting)'
      - name: Build and vet on real Windows
        run: |
          .github/windows-ci-command.ps1 build go build -tags 'goolm,no_web' ./...
          .github/windows-ci-command.ps1 vet go vet -tags 'goolm,no_web' ./...
      - name: Full Windows tests
        id: windows_suite
        run: .github/windows-ci-command.ps1 windows-tests go test -json -tags 'goolm,no_web' -count=1 -timeout 10m ./...
      - name: Windows critical user journeys
        if: always() && (steps.windows_suite.outcome == 'success' || steps.windows_suite.outcome == 'failure')
        run: .github/windows-ci-command.ps1 windows-cuj go test -json -tags 'goolm,no_web' -count=1 -timeout 5m ./core -run TestCUJ
      - name: Record Windows skips and results
        if: always()
        run: |
          python -B .github/summarize-restart-tests.py .cache/evidence/windows-tests.log
          python -B .github/summarize-restart-tests.py .cache/evidence/windows-cuj.log
      - name: Compare full-suite failures with unchanged baseline
        if: always() && steps.windows_suite.outcome == 'failure'
        run: |
          # Remove only the two fixtures this workflow copied into the baseline.
          Remove-Item .cache/baseline/core/updater_locked_windows_test.go
          Remove-Item .cache/baseline/daemon/legacy-supervisor_windows_test.go
          Push-Location .cache/baseline
          go test -json -tags 'goolm,no_web' -count=1 -timeout 10m ./... 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/.cache/evidence/baseline-tests.log"
          $baselineCode=$LASTEXITCODE
          go test -json -tags 'goolm,no_web' -count=1 -timeout 5m ./core -run TestCUJ 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/.cache/evidence/baseline-cuj.log"
          $baselineCujCode=$LASTEXITCODE
          Pop-Location
          Write-Host "::notice::Unchanged baseline full-suite exit: $baselineCode; CUJ exit: $baselineCujCode. The fixed-source failure remains a failed check."
          python -B .github/summarize-restart-tests.py .cache/evidence/baseline-tests.log
          python -B .github/summarize-restart-tests.py .cache/evidence/baseline-cuj.log
          python -B .github/compare-windows-baseline.py .cache/evidence/windows-tests.summary.json .cache/evidence/baseline-tests.summary.json
          python -B .github/compare-windows-baseline.py .cache/evidence/windows-cuj.summary.json .cache/evidence/baseline-cuj.summary.json
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-restart-evidence
          path: .cache/evidence/
          retention-days: 14
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMPDIR: ${{ github.workspace }}/.cache/tmp
      TEMP: ${{ github.workspace }}/.cache/tmp
      TMP: ${{ github.workspace }}/.cache/tmp
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOPATH: ${{ github.workspace }}/.cache/go-path
      GOBIN: ${{ github.workspace }}/.cache/go-path/bin
      GOTMPDIR: ${{ github.workspace }}/.cache/tmp
      PROJECT_TOOL_CACHE: ${{ github.workspace }}/.cache/tools
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg-cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/xdg-data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Prepare project outputs
        run: |
          set -euo pipefail
          for output in "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOPATH" "$GOBIN" "$GOTMPDIR" "$PROJECT_TOOL_CACHE" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"; do
            case "$(realpath -m "$output")" in "$GITHUB_WORKSPACE"/*) ;; *) exit 1 ;; esac
            mkdir -p "$output"
          done
      - name: Install pinned Go
        run: bash .github/setup-release-tools.sh go
      - name: Build and vet
        run: |
          bash .github/ci-command.sh build go build -tags 'goolm,no_web' ./...
          bash .github/ci-command.sh vet go vet -tags 'goolm,no_web' ./...
      - name: Full race tests and CUJ
        run: |
          bash .github/ci-command.sh tests go test -json -race -tags 'goolm,no_web' -count=1 -timeout 10m ./...
          bash .github/ci-command.sh cuj go test -race -tags 'goolm,no_web' -count=1 -timeout 5m ./core -run TestCUJ
      - name: Record Linux skips and results
        if: always()
        run: python3 -B .github/summarize-restart-tests.py .cache/verification/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-restart-evidence
          path: .cache/verification/
          retention-days: 14
